<!doctype html><html><head><meta charset="utf-8"></head><body>
<pre id="out">…</pre>
<script>
var out = [];
function load(src){return new Promise(function(res, rej){
  var i = new Image();
  i.onload = function(){ out.push(src + ' ok ' + i.naturalWidth + 'x' + i.naturalHeight); res(i); };
  i.onerror = function(e){ out.push(src + ' ОШИБКА'); res(null); };
  i.src = src;
});}
Promise.all([load('case05-figma-frame.png'), load('case05-render.png')]).then(function(im){
  out.push('резолв, картинки: ' + im.filter(Boolean).length);
  document.getElementById('out').textContent = 'DBG\n' + out.join('\n') + '\nEND';
});
</script></body></html>
