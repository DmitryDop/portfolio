<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>Пробник кейса 05 в рамке 390</title>
<style>html,body{margin:0}iframe{width:390px;height:6000px;border:0;display:block}</style></head>
<body>
<iframe id="f" src="case05-measure.html"></iframe>
<script>
var f = document.getElementById('f');
var tries = 0;
var t = setInterval(function () {
  tries++;
  var d = f.contentDocument;
  var inner = d && d.getElementById('MEASURE');
  if (inner || tries > 3000) {
    clearInterval(t);
    var out = [];
    out.push('viewport=390');
    if (!inner) { out.push('внутренний MEASURE не появился'); }
    else {
      out.push(inner.textContent);
      out.push('innerScrollW=' + d.documentElement.scrollWidth +
               ' innerClientW=' + d.documentElement.clientWidth);
    }
    var pre = document.createElement('pre');
    pre.id = 'MEASURE';
    pre.textContent = 'MEASURE\n' + out.join('\n');
    document.body.appendChild(pre);
  }
}, 100);
</script>
</body></html>
