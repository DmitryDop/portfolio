<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Сравнение</title></head><body>
<pre id="out">…</pre>
<script>
var files = [['figma-frame.png', 1096], ['render.png', 1440]];
var res = {};
function load(src){return new Promise(function(r){var i=new Image();i.onload=function(){r(i)};i.src=src;});}
function profile(img, outW){
  var h = Math.round(img.height * outW / img.width);
  var c = document.createElement('canvas'); c.width = outW; c.height = h;
  var x = c.getContext('2d'); x.drawImage(img, 0, 0, outW, h);
  var d = x.getImageData(0, 0, outW, h).data;
  var rows = [];
  for (var y = 0; y < h; y++){
    var r=0,g=0,b=0,n=outW;
    for (var px = 0; px < outW; px++){
      var i = (y*outW+px)*4; r+=d[i]; g+=d[i+1]; b+=d[i+2];
    }
    rows.push([Math.round(r/n), Math.round(g/n), Math.round(b/n)]);
  }
  return {h:h, rows:rows, w:outW};
}
function classify(c){
  var r=c[0],g=c[1],b=c[2];
  if (r>250&&g>248&&b>246) return 'W';            // белая плита
  if (Math.abs(r-249)<4&&Math.abs(g-243)<4&&Math.abs(b-240)<4) return 'P'; // #f9f3f0
  if (Math.abs(r-174)<6&&Math.abs(g-121)<6&&Math.abs(b-101)<6) return 'B'; // #ae7965
  return '.';
}
function runs(p){
  var out=[], cur=null;
  for (var y=0;y<p.h;y++){
    var k = classify(p.rows[y]);
    if (!cur || cur.k!==k){ cur={k:k,from:y,to:y}; out.push(cur); } else cur.to=y;
  }
  return out.filter(function(r){ return r.to-r.from > 12; });
}
Promise.all(files.map(function(f){return load(f[0])})).then(function(imgs){
  var L=[];
  imgs.forEach(function(im, idx){
    var p = profile(im, 1096);
    L.push('--- ' + files[idx][0] + ' (h=' + p.h + ') ---');
    runs(p).forEach(function(r){
      L.push(r.k + ': ' + r.from + '..' + r.to + '  (' + (r.to-r.from+1) + ')  при 1440: ' + Math.round(r.from*1440/1096) + '..' + Math.round(r.to*1440/1096));
    });
  });
  document.getElementById('out').textContent = 'RESULT\n'+L.join('\n')+'\nEND';
});
</script></body></html>
