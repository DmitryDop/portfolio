<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Замер</title>
<style>html,body{margin:0}iframe{width:1440px;height:5000px;border:0;display:block}
pre{position:fixed;left:0;top:0;background:#fff;font:12px monospace;z-index:9}</style>
</head><body>
<iframe id="f" src="../cases/reactor.html"></iframe>
<pre id="out">…</pre>
<script>
var f = document.getElementById('f');
f.addEventListener('load', function () {
  setTimeout(function () {
    var d = f.contentDocument, w = f.contentWindow;
    var L = [];
    function box(sel, label) {
      var el = d.querySelector(sel);
      if (!el) { L.push(label + ': НЕТ'); return; }
      var r = el.getBoundingClientRect();
      L.push(label + ': y=' + Math.round(r.top) + ' h=' + Math.round(r.height) + ' w=' + Math.round(r.width) + ' bottom=' + Math.round(r.bottom));
    }
    L.push('docHeight=' + d.documentElement.scrollHeight);
    box('.header', 'header');
    box('.sub-header', 'sub-header');
    box('.case-hero', 'hero');
    box('.case-hero__title', 'hero__title');
    box('.case-hero__media', 'hero__media');
    box('.case-hero__text', 'hero__text');
    var secs = d.querySelectorAll('.case-section');
    for (var i = 0; i < secs.length; i++) box('.case-section:nth-of-type(' + (i+1) + ')', '  ?');
    var all = d.querySelectorAll('.case-hero, .case-section, .case-band, .footer');
    for (var i = 0; i < all.length; i++) {
      var el = all[i], r = el.getBoundingClientRect();
      L.push((el.className.split(' ')[0]) + (el.id ? '#'+el.id : '') + ' :: y=' + Math.round(r.top) + ' h=' + Math.round(r.height) + ' bottom=' + Math.round(r.bottom));
    }
    box('.case-media--tall', 'media--tall');
    box('.case-media--tall img', 'media--tall img');
    box('.case-band__head', 'band__head');
    box('.case-band__title', 'band__title');
    box('.case-band__text', 'band__text');
    box('.case-band__media', 'band__media');
    box('.case-media__shot', 'media__shot');
    box('.case-media.media-card', 'media-card');
    box('.feature-grid', 'feature-grid');
    box('.feature-card', 'feature-card');
    box('.footer', 'footer');
    var t = d.querySelector('.case-hero__title');
    L.push('hero__title font=' + w.getComputedStyle(t).fontSize + ' lh=' + w.getComputedStyle(t).lineHeight);
    var g = d.querySelector('.case-section__title');
    L.push('section__title font=' + w.getComputedStyle(g).fontSize + ' lh=' + w.getComputedStyle(g).lineHeight);
    document.getElementById('out').textContent = 'RESULT\n' + L.join('\n') + '\nEND';
  }, 600);
});
</script>
</body></html>
