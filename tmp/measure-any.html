<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Замер</title>
<style>html,body{margin:0}iframe{width:1440px;height:6000px;border:0;display:block}
pre{position:fixed;left:0;top:0;background:#fff;font:12px monospace;z-index:9}</style>
</head><body>
<!-- Обёртка для замера любой страницы: tmp/measure-any.html?src=../index.html
     Печатает вертикальные границы шапки, суб-хедера, всех блоков main и подвала -->
<iframe id="f"></iframe>
<pre id="out">…</pre>
<script>
var src = new URLSearchParams(location.search).get('src') || '../cases/reactor.html';
var f = document.getElementById('f');
f.src = src + (src.indexOf('?') < 0 ? '?' : '&') + 'v=' + Date.now();
f.addEventListener('load', function () {
  setTimeout(function () {
    var d = f.contentDocument, L = [];
    function box(el, label) {
      var r = el.getBoundingClientRect();
      L.push(label + ' :: y=' + Math.round(r.top) + ' h=' + Math.round(r.height) + ' bottom=' + Math.round(r.bottom));
    }
    box(d.querySelector('.header'), 'header');
    var sh = d.querySelector('.sub-header');
    if (sh) box(sh, 'sub-header');
    var main = d.querySelector('main');
    for (var i = 0; i < main.children.length; i++) {
      var el = main.children[i];
      box(el, (i + 1) + ' ' + el.tagName.toLowerCase() + '.' + el.className.split(' ')[0]);
    }
    box(d.querySelector('footer'), 'footer');
    L.push('docHeight=' + d.documentElement.scrollHeight);
    document.getElementById('out').textContent = 'RESULT\n' + L.join('\n') + '\nEND';
  }, 700);
});
</script>
</body></html>
