<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Замер 2</title></head><body>
<iframe id="f" src="../cases/reactor.html" style="width:1440px;height:5000px;border:0"></iframe>
<pre id="out">…</pre>
<script>
document.getElementById('f').addEventListener('load', function(){
  setTimeout(function(){
    var d=document.getElementById('f').contentDocument, w=document.getElementById('f').contentWindow;
    var L=[];
    function r(el,label){
      var b=el.getBoundingClientRect();
      L.push(label+' y='+Math.round(b.top)+'..'+Math.round(b.bottom)+' h='+Math.round(b.height)+' x='+Math.round(b.left)+' w='+Math.round(b.width));
    }
    var secs=d.querySelectorAll('.case-section');
    for(var i=0;i<secs.length;i++){
      var s=secs[i];
      r(s,'S'+(i+1)+' section');
      r(s.querySelector('.case-section__inner'),'  inner');
      r(s.querySelector('.case-section__text'),'  text');
      r(s.querySelector('.case-section__num'),'  num');
      var t=s.querySelector('.case-section__title');
      r(t,'  title "'+t.textContent.trim()+'"');
      var bd=s.querySelector('.case-section__body');
      r(bd,'  body lines='+Math.round(bd.getBoundingClientRect().height/24));
      var right=s.querySelector('.feature-grid, .case-media');
      r(right,'  right '+right.className);
      var fc=s.querySelectorAll('.feature-card');
      for(var j=0;j<fc.length;j++) r(fc[j],'    card'+j);
      L.push('  inner align='+w.getComputedStyle(s.querySelector('.case-section__inner')).alignItems+' padTop='+w.getComputedStyle(s).paddingTop+' padBottom='+w.getComputedStyle(s).paddingBottom);
    }
    document.getElementById('out').textContent='RESULT\n'+L.join('\n')+'\nEND';
  },700);
});
</script></body></html>
